aid: tradeblock
name: Tradeblock
description: >-
  Tradeblock (operated by Astrolab, Inc. d/b/a Tradeblock, founded 2019) is a
  mobile-first, peer-to-peer sneaker trading marketplace that lets collectors use
  their sneakers as currency. Members build a Closet and Wishlist, browse a feed of
  public and private trade offers, and swap sneakers with other collectors, balancing
  uneven trades with cash. Every trade routes through Tradeblock's authentication
  centers, where shoes are verified for authenticity before shipping to each party.
  The service also surfaces supply-and-demand signals for individual sneaker models.
  Tradeblock is a consumer app (iOS, Android, and web) backed by Andreessen Horowitz
  (a16z), Trinity Ventures, and DCVC; it does not publish a public developer API,
  SDKs, or a developer portal at this time.
